# Optional overlay: docker compose -f docker-compose.yaml -f secret-store.yaml ...
# Provision the private key OUTSIDE this repository and the Manager image/build context.
services:
  backend:
    user: "10001:10001"
    environment:
      SECRET_STORE_WORKER_SOCKET: /run/secret-store/import.sock
      SECRET_STORE_IMPORT_KEY_FINGERPRINT: ${SECRET_STORE_IMPORT_KEY_FINGERPRINT:?Pin the worker public key fingerprint}
    volumes:
      - secret_store_socket:/run/secret-store:ro
    depends_on:
      secret_store_worker:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0

  secret_store_worker:
    image: contract-secret-store-worker:local
    build:
      context: ..
      dockerfile: Dockerfile.secret-store-worker
    user: "10001:10001"
    environment:
      SECRET_STORE_WORKER_SOCKET: /run/secret-store/import.sock
      SECRET_STORE_PRIVATE_KEY_FILE: /private/import-key.pem
    volumes:
      - secret_store_socket:/run/secret-store
      - type: bind
        source: ${SECRET_STORE_PRIVATE_KEY_FILE:?Provision an external RSA-4096 private key}
        target: /private/import-key.pem
        read_only: true
        bind:
          create_host_path: false
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 32
    mem_limit: 128m
    cpus: 1.0
    ulimits:
      core: 0
    restart: "no"
    stop_grace_period: 10s

volumes:
  secret_store_socket:
