# Add after secret-store.yaml for the complete preparation flow.
# No platform deployment or privileged UV device is required by this worker.
services:
  backend:
    environment:
      REQUEST_TIMEOUT: 4m
  secret_store_worker:
    image: contract-secret-preparation-worker:local
    build:
      context: ..
      dockerfile: Dockerfile.secret-preparation-worker
      args:
        PVSECRET_TOOLS_IMAGE: ${PVSECRET_TOOLS_IMAGE:?Provide an immutable tools image with IBM pvsecret}
    environment:
      SECRET_STORE_PVSECRET_BIN: /usr/local/bin/pvsecret
      SECRET_STORE_HOST_CERTIFICATES: /trust/ibm-z-signing.crt /trust/intermediate.crt
      SECRET_STORE_HOST_CRLS: /trust/ibm-z-signing.crl /trust/intermediate.crl
      SECRET_STORE_ROOT_CA: /trust/root-ca.crt
      SECRET_STORE_REQUEST_SIGNING_KEY: /request-signing/private.pem
      SECRET_STORE_REQUEST_SIGNING_CERTIFICATE: /request-signing/public.crt
      # Offline creation inside an explicitly trusted SE worker must be opted in.
      SECRET_STORE_ALLOW_GUEST_CREATION: ${SECRET_STORE_ALLOW_GUEST_CREATION:-false}
      # Never enabled implicitly because native operations fail.
      SECRET_STORE_ALLOW_SIMULATION: ${SECRET_STORE_ALLOW_SIMULATION:-false}
    volumes:
      - type: bind
        source: ${SECRET_STORE_IBM_TRUST_DIRECTORY:?Provision current verified IBM certificates and CRLs}
        target: /trust
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SECRET_STORE_REQUEST_SIGNING_DIRECTORY:?Provision an external request-signing key and certificate}
        target: /request-signing
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    mem_limit: 256m
